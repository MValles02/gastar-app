# Image build and Dokploy redeployment for both environments: pushes to `main`
# deploy production (web.gastar.app), pushes to `develop` deploy the development
# environment (dev.gastar.app). Deploy secrets live in the `production` and
# `development` GitHub environments, not at repository level.
# CI checks run on the PR (required by the ruleset) and are not repeated on push.
# A manual run redeploys the current branch tip, which reached main/develop only
# through a PR that passed those checks; it must be confirmed by typing the
# branch name, so a stray click never redeploys production.
name: Deploy

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the branch name (main or develop) to confirm the redeploy
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to GHCR
    # workflow_dispatch can be run from any branch; restrict to main and develop
    # so a manual trigger from any other branch never builds or deploys.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20
    steps:
      - name: Confirm manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Confirmation '$CONFIRM' does not match branch '$GITHUB_REF_NAME'; nothing was built or deployed."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/mvalles02/gastar-app
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Dokploy
    needs: publish
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    # Secrets live in the "production" (main only) and "development" (develop
    # only) environments.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    permissions: {}
    timeout-minutes: 15
    steps:
      - name: Trigger Dokploy deploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          for v in WEBHOOK CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret for $v is not configured."
              exit 1
            fi
          done
          curl -fsS -X POST "$WEBHOOK" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
          echo "Redeployment webhook sent."

      - name: Wait for new version
        env:
          HEALTH_URL: ${{ github.ref == 'refs/heads/main' && vars.HEALTH_URL || vars.DEV_HEALTH_URL }}
          HEALTH_VAR: ${{ github.ref == 'refs/heads/main' && 'HEALTH_URL' || 'DEV_HEALTH_URL' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::$HEALTH_VAR is not configured."
            exit 1
          fi
          for i in $(seq 30); do curl -fsS -m 10 -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$HEALTH_URL" | jq -e --arg s "$GITHUB_SHA" '.status=="ok" and .sha==$s' && exit 0; sleep 10; done
          echo "::error::Timed out waiting for the new version to become healthy."
          exit 1

      - name: Smoke test
        env:
          HEALTH_URL: ${{ github.ref == 'refs/heads/main' && vars.HEALTH_URL || vars.DEV_HEALTH_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          BASE=$(printf '%s' "$HEALTH_URL" | cut -d/ -f1-3)
          curl -fsSL -o /dev/null -m 20 --retry 3 --retry-delay 5 -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$BASE/"
          STATUS=$(curl -fsSL -o /dev/null -w '%{http_code}' -m 20 -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$BASE/")
          echo "Home page responded with HTTP $STATUS"
