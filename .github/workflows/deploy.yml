name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Build and publish to GHCR
    needs: checks
    # workflow_dispatch can be run from any branch; restrict to main so a
    # manual trigger never builds or deploys non-main code to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/mvalles02/gastar-app
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Dokploy
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 15
    steps:
      - name: Trigger Dokploy deploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          for v in WEBHOOK CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret for $v is not configured."
              exit 1
            fi
          done
          curl -fsS -X POST "$WEBHOOK" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
          echo "Redeployment webhook sent."

      - name: Wait for new version
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::HEALTH_URL is not configured."
            exit 1
          fi
          for i in $(seq 30); do curl -fsS -m 10 "$HEALTH_URL" | jq -e --arg s "$GITHUB_SHA" '.status=="ok" and .sha==$s' && exit 0; sleep 10; done
          echo "::error::Timed out waiting for the new version to become healthy."
          exit 1

      - name: Smoke test
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          BASE=$(printf '%s' "$HEALTH_URL" | cut -d/ -f1-3)
          curl -fsSL -o /dev/null -m 20 --retry 3 --retry-delay 5 "$BASE/"
          STATUS=$(curl -fsSL -o /dev/null -w '%{http_code}' -m 20 "$BASE/")
          echo "Home page responded with HTTP $STATUS"
