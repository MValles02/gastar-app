name: Promotion guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  develop-only:
    name: develop-only
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # GitHub rulesets cannot restrict a PR's source branch, so this required
      # check does: only develop of this repository may be merged into main.
      # A repository without a develop branch (HTTP 404) is single-environment
      # and passes; any other API error fails, never passes silently.
      - name: Require develop as the PR source
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if err=$(gh api "repos/$THIS_REPO/branches/develop" 2>&1 >/dev/null); then
            if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
              echo "::error::Only develop of $THIS_REPO can be merged into main (got $HEAD_REPO:$HEAD_REF)."
              exit 1
            fi
          elif printf '%s' "$err" | grep -q '(HTTP 404)'; then
            echo "::notice::No develop branch in $THIS_REPO: single-environment repo, any PR may target main."
          else
            echo "::error::Could not check for the develop branch: $err"
            exit 1
          fi
