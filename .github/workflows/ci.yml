name: CI

on:
  pull_request:
  # deploy.yml calls this workflow before a manual (workflow_dispatch) deploy,
  # so a dispatch never ships a commit without the same checks a PR gets.
  # No push trigger: a push-only job in this workflow would leave skipped
  # `checks`/`e2e` runs on the pushed commit, and a skipped check satisfies a
  # required status check. Secrets are scanned per PR (`checks`) and by the
  # husky pre-commit hook.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # On a PR, HEAD is the test merge commit (parent 1: base tip, parent 2:
      # PR head), so PR-commit-count + 1 levels reach the oldest PR commit
      # without fetching the whole history. Outside a PR the count is 0 (a
      # shallow checkout of the commit). Computed in shell because workflow
      # expressions have no arithmetic.
      - name: Size the fetch
        id: pr
        run: echo "depth=$(( $(jq '.pull_request.commits // 0' "$GITHUB_EVENT_PATH") + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ steps.pr.outputs.depth }}
          persist-credentials: false

      - name: Secrets scan (gitleaks)
        if: github.event_name == 'pull_request'
        run: |
          # HEAD^1..HEAD^2 is exactly the PR's commits and both ends are always
          # inside the shallow fetch above.
          # Pinned by digest (not just tag) so a compromised/republished tag can't slip a different image into CI.
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --verbose --exit-code 1 --log-opts="HEAD^1..HEAD^2"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fixed throwaway test values; none of these are secrets. The repo's
      # optional `ci:env` script adds its own KEY=VALUE lines (later lines win).
      - name: Set env
        run: |
          echo "DATABASE_URL=postgresql://ci:ci@localhost:5432/ci" >> "$GITHUB_ENV"
          pnpm --silent run --if-present ci:env checks >> "$GITHUB_ENV"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm run --if-present test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Started first so the image pull overlaps checkout, install and build.
      - name: Start Postgres
        run: >-
          docker run -d --name pg -p 5432:5432
          -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci
          postgres:17-alpine

      # Same depth as in `checks`: on a PR it reaches HEAD^1 (the base tip).
      - name: Size the fetch
        id: pr
        run: echo "depth=$(( $(jq '.pull_request.commits // 0' "$GITHUB_EVENT_PATH") + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ steps.pr.outputs.depth }}
          persist-credentials: false

      # A PR that changes only *.md files skips the Playwright steps but the
      # job still succeeds, so the required `e2e` check is satisfied. HEAD is
      # the test merge commit, so HEAD^1..HEAD is exactly the PR's change.
      # Outside a PR (deploy.yml's workflow_call) this step does not run and
      # the full e2e always runs.
      - name: Detect Markdown-only PR
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          files="$(git diff --name-only HEAD^1 HEAD)"
          if [ -n "$files" ] && ! grep -qv '\.md$' <<< "$files"; then
            echo "md_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Markdown-only PR: Playwright steps skipped"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set env
        run: |
          echo "DATABASE_URL=postgresql://ci:ci@localhost:5432/ci" >> "$GITHUB_ENV"
          pnpm --silent run --if-present ci:env e2e >> "$GITHUB_ENV"

      - name: Wait for Postgres
        if: steps.changes.outputs.md_only != 'true'
        run: |
          for _ in $(seq 30); do
            docker exec pg pg_isready -U ci -d ci && exit 0
            sleep 1
          done
          echo "::error::Postgres not ready after 30s"
          exit 1

      - name: Apply migrations
        if: steps.changes.outputs.md_only != 'true'
        run: pnpm run --if-present db:deploy

      - name: E2E setup
        if: steps.changes.outputs.md_only != 'true'
        run: pnpm run --if-present test:e2e:setup

      - name: E2E tests
        if: steps.changes.outputs.md_only != 'true'
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Traces and failure screenshots (see `use` in playwright.config.ts).
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
