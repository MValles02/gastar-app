name: CI

on:
  pull_request:
  # deploy.yml calls this workflow before a manual (workflow_dispatch) deploy,
  # so a dispatch never ships a commit without the same checks a PR gets.
  # Push scanning lives in secrets-scan.yml, not here: a push-only job in this
  # workflow would leave skipped `checks`/`e2e` runs on the pushed commit, and
  # a skipped check satisfies a required status check.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # On a PR, HEAD is the test merge commit (parent 1: base tip, parent 2:
      # PR head), so PR-commit-count + 1 levels reach the oldest PR commit
      # without fetching the whole history. Outside a PR the count is 0 (a
      # shallow checkout of the commit). Computed in shell because workflow
      # expressions have no arithmetic.
      - name: Size the fetch
        id: pr
        run: echo "depth=$(( $(jq '.pull_request.commits // 0' "$GITHUB_EVENT_PATH") + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ steps.pr.outputs.depth }}
          persist-credentials: false

      - name: Secrets scan (gitleaks)
        if: github.event_name == 'pull_request'
        run: |
          # HEAD^1..HEAD^2 is exactly the PR's commits and both ends are always
          # inside the shallow fetch above.
          # Pinned by digest (not just tag) so a compromised/republished tag can't slip a different image into CI.
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --verbose --exit-code 1 --log-opts="HEAD^1..HEAD^2"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fixed throwaway test values; none of these are secrets. The repo's
      # optional `ci:env` script adds its own KEY=VALUE lines (later lines win).
      - name: Set env
        run: |
          echo "DATABASE_URL=postgresql://ci:ci@localhost:5432/ci" >> "$GITHUB_ENV"
          pnpm --silent run --if-present ci:env checks >> "$GITHUB_ENV"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm run --if-present db:deploy

      - name: Test
        run: pnpm run --if-present test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set env
        run: |
          echo "DATABASE_URL=postgresql://ci:ci@localhost:5432/ci" >> "$GITHUB_ENV"
          pnpm --silent run --if-present ci:env e2e >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm run --if-present db:deploy

      - name: E2E setup
        run: pnpm run --if-present test:e2e:setup

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Traces and failure screenshots (see `use` in playwright.config.ts).
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
